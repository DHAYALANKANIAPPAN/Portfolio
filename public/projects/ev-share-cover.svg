<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a" />
      <stop offset="50%" stop-color="#071b2e" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="ev-cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="ev-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#ev-bg)" />

  <!-- Radar Geolocation Grid -->
  <g opacity="0.12" stroke="#00FFB3" stroke-width="1">
    <path d="M0 60 H800 M0 130 H800 M0 200 H800 M0 270 H800 M0 340 H800 M0 410 H800 M0 480 H800" />
    <path d="M60 0 V500 M140 0 V500 M220 0 V500 M300 0 V500 M380 0 V500 M460 0 V500 M540 0 V500 M620 0 V500 M700 0 V500 M780 0 V500" />
    <!-- Concentric radar circles -->
    <circle cx="250" cy="270" r="80" fill="none" stroke="#00E5FF" stroke-dasharray="4,4" />
    <circle cx="250" cy="270" r="140" fill="none" stroke="#00FFB3" stroke-dasharray="6,6" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="220" cy="260" r="140" fill="#00FFB3" opacity="0.08" filter="url(#ev-glow)" />
  <circle cx="620" cy="240" r="160" fill="#00E5FF" opacity="0.08" filter="url(#ev-glow)" />

  <!-- Main Shell Window -->
  <g transform="translate(50, 45)">
    <rect width="700" height="410" rx="16" fill="#061226" stroke="#00FFB3" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Top Header -->
    <rect width="700" height="42" rx="16" fill="#0a1d3b" />
    <rect y="24" width="700" height="18" fill="#0a1d3b" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="350" y="26" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">EV_Share — Electric Vehicle Charging &amp; Slot Sharing Platform</text>

    <!-- Inner Split Layout -->
    <g transform="translate(20, 58)">
      <!-- Left: Interactive Map & Station Grid -->
      <g>
        <rect width="390" height="315" rx="12" fill="#030b17" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" />
        
        <!-- Map Canvas Simulation -->
        <rect x="15" y="15" width="360" height="160" rx="8" fill="#05162a" />
        
        <!-- Map roads / routes -->
        <path d="M25 80 Q 120 40, 200 90 T 365 70" fill="none" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.5" />
        <path d="M120 25 L 200 90 L 260 160" fill="none" stroke="#00FFB3" stroke-width="2.5" stroke-opacity="0.4" />
        <path d="M60 160 Q 180 130, 340 145" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />

        <!-- Station Pin Active -->
        <g transform="translate(200, 90)">
          <circle cx="0" cy="0" r="14" fill="#00FFB3" opacity="0.3" filter="url(#ev-glow)" />
          <circle cx="0" cy="0" r="7" fill="#00FFB3" />
          <rect x="-45" y="-32" width="90" height="20" rx="4" fill="#001826" stroke="#00FFB3" stroke-width="1" />
          <text x="0" y="-18" fill="#00FFB3" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">STATION #42 · ACTIVE</text>
        </g>

        <!-- Secondary Station Pins -->
        <circle cx="100" cy="65" r="5" fill="#00E5FF" />
        <circle cx="310" cy="75" r="5" fill="#FFBD2E" />

        <!-- Slot Availability Matrix -->
        <g transform="translate(15, 190)" font-family="monospace" font-size="10">
          <rect width="360" height="110" rx="8" fill="#071b32" stroke="#ffffff" stroke-opacity="0.08" />
          
          <text x="14" y="24" fill="#00FFB3" font-weight="bold">CHARGING SLOTS OCCUPANCY</text>
          
          <!-- Dock A -->
          <rect x="14" y="38" width="105" height="58" rx="6" fill="#040e1e" stroke="#00FFB3" stroke-width="1" />
          <text x="24" y="56" fill="#FFFFFF" font-weight="bold">DOCK A</text>
          <text x="24" y="72" fill="#00FFB3">● AVAILABLE</text>
          <text x="24" y="86" fill="#E5E7F5" opacity="0.7">22kW Fast</text>

          <!-- Dock B -->
          <rect x="127" y="38" width="105" height="58" rx="6" fill="#040e1e" stroke="#FFBD2E" stroke-width="1" />
          <text x="137" y="56" fill="#FFFFFF" font-weight="bold">DOCK B</text>
          <text x="137" y="72" fill="#FFBD2E">⚡ CHARGING</text>
          <text x="137" y="86" fill="#E5E7F5" opacity="0.7">84% · 14m left</text>

          <!-- Dock C -->
          <rect x="241" y="38" width="105" height="58" rx="6" fill="#040e1e" stroke="#00E5FF" stroke-width="1" />
          <text x="251" y="56" fill="#FFFFFF" font-weight="bold">DOCK C</text>
          <text x="251" y="72" fill="#00E5FF">🔒 RESERVED</text>
          <text x="251" y="86" fill="#E5E7F5" opacity="0.7">Token #EV-804</text>
        </g>
      </g>

      <!-- Right: Real-time Booking Engine & Telemetry -->
      <g transform="translate(405, 0)">
        <rect width="255" height="315" rx="12" fill="#030b17" stroke="#ffffff" stroke-opacity="0.08" />
        
        <g transform="translate(16, 22)" font-family="monospace">
          <text x="0" y="0" fill="#00E5FF" font-size="11" font-weight="bold">BOOKING DISPATCH ENGINE</text>
          
          <rect y="14" width="223" height="48" rx="6" fill="#091f38" stroke="#00FFB3" stroke-width="0.8" />
          <text x="10" y="34" fill="#E5E7F5" font-size="10">Active Slot Lock:</text>
          <text x="10" y="50" fill="#00FFB3" font-size="11" font-weight="bold">OCC-Atomic · Zero Collision</text>

          <rect y="70" width="223" height="52" rx="6" fill="#07182c" />
          <text x="10" y="90" fill="#E5E7F5" opacity="0.7" font-size="9">API Gateway Latency</text>
          <text x="10" y="110" fill="#00E5FF" font-size="12" font-weight="bold">&lt; 18ms (Node + Mongo)</text>

          <rect y="130" width="223" height="52" rx="6" fill="#07182c" />
          <text x="10" y="150" fill="#E5E7F5" opacity="0.7" font-size="9">Geolocation Radar</text>
          <text x="10" y="170" fill="#00FFB3" font-size="12" font-weight="bold">Mapbox / Leaflet Live</text>

          <rect y="190" width="223" height="85" rx="6" fill="#0a2544" stroke="#00E5FF" stroke-width="1" />
          <text x="10" y="210" fill="#00E5FF" font-size="10" font-weight="bold">TECH ARCHITECTURE</text>
          <text x="10" y="228" fill="#E5E7F5" font-size="9">• React UI + Tailwind CSS</text>
          <text x="10" y="244" fill="#E5E7F5" font-size="9">• Node.js / Express REST API</text>
          <text x="10" y="260" fill="#00FFB3" font-size="9">• MongoDB Atomic Locking</text>
        </g>
      </g>
    </g>
  </g>
</svg>
