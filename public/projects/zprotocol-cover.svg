<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="zp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060614" />
      <stop offset="50%" stop-color="#120c28" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="zp-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00FFB3" />
    </linearGradient>
    <filter id="zp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#zp-bg)" />

  <!-- Binary Matrix Rain background subtle -->
  <g font-family="monospace" font-size="10" fill="#7B61FF" opacity="0.15">
    <text x="50" y="40">01011010 01010000 01010010 01001111 01010100 01001111 01000011 01001111 01001100</text>
    <text x="50" y="80">0x5A 0x50 0x01 0x00 0xFF 0x18 0x2A 0x89 0x90 0xAA 0xBB 0xCC 0xDD 0xEE 0xFF</text>
    <text x="50" y="440">SOCKET_RAW_AF_INET · PROTO_CUSTOM_Z · NON_BLOCKING_IO · CRC32_CHECKSUM_OK</text>
    <text x="50" y="470">ESTABLISHED 10.0.0.1:9090 &lt;--- Z-PROTOCOL FRAMES ---&gt; 10.0.0.2:9090</text>
  </g>

  <!-- Main Protocol Frame Visualizer -->
  <g transform="translate(60, 100)">
    <rect width="680" height="310" rx="16" fill="#0d0f28" stroke="#7B61FF" stroke-width="1.5" stroke-opacity="0.7" />
    
    <!-- Top Header -->
    <rect width="680" height="40" rx="16" fill="#18173d" />
    <rect y="24" width="680" height="16" fill="#18173d" />
    <circle cx="24" cy="20" r="5" fill="#FF5F56" />
    <circle cx="40" cy="20" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="20" r="5" fill="#27C93F" />
    <text x="340" y="24" fill="#E5E7F5" font-family="monospace" font-size="12" text-anchor="middle">Z-Protocol Binary Wire Specification (Layer 4/5)</text>

    <!-- Wire Frame Layout (32-bit words) -->
    <g transform="translate(25, 55)">
      <!-- 32-bit Ruler -->
      <rect width="630" height="24" rx="4" fill="#121330" />
      <text x="15" y="16" fill="#7B61FF" font-family="monospace" font-size="10">Bit 0</text>
      <text x="160" y="16" fill="#7B61FF" font-family="monospace" font-size="10">Bit 8</text>
      <text x="315" y="16" fill="#7B61FF" font-family="monospace" font-size="10">Bit 16</text>
      <text x="475" y="16" fill="#7B61FF" font-family="monospace" font-size="10">Bit 24</text>
      <text x="605" y="16" fill="#7B61FF" font-family="monospace" font-size="10">Bit 31</text>

      <!-- Row 1: Magic Byte + Version + Flags + OpCode -->
      <g transform="translate(0, 30)">
        <rect width="155" height="40" rx="4" fill="#1d1645" stroke="#7B61FF" stroke-width="1" />
        <text x="77" y="24" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">MAGIC: 0x5A ('Z')</text>
        
        <rect x="158" width="155" height="40" rx="4" fill="#1a1c4b" stroke="#7B61FF" stroke-width="1" />
        <text x="235" y="24" fill="#00FFB3" font-family="monospace" font-size="11" text-anchor="middle">VERSION (v1.2)</text>

        <rect x="316" width="155" height="40" rx="4" fill="#17224f" stroke="#00E5FF" stroke-width="1" />
        <text x="393" y="24" fill="#FFBD2E" font-family="monospace" font-size="11" text-anchor="middle">FLAGS (SYN/ACK/FIN)</text>

        <rect x="474" width="156" height="40" rx="4" fill="#132a4e" stroke="#00E5FF" stroke-width="1" />
        <text x="552" y="24" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">OPCODE: 0x07</text>
      </g>

      <!-- Row 2: Sequence Number & Ack -->
      <g transform="translate(0, 75)">
        <rect width="313" height="40" rx="4" fill="#112242" stroke="#00E5FF" stroke-width="1" />
        <text x="156" y="24" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">SEQUENCE NUMBER (32-bit uint)</text>

        <rect x="316" width="314" height="40" rx="4" fill="#112242" stroke="#00E5FF" stroke-width="1" />
        <text x="473" y="24" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle">ACKNOWLEDGMENT NUMBER (32-bit uint)</text>
      </g>

      <!-- Row 3: Payload Length + CRC32 -->
      <g transform="translate(0, 120)">
        <rect width="205" height="40" rx="4" fill="#13273e" stroke="#00FFB3" stroke-width="1" />
        <text x="102" y="24" fill="#00FFB3" font-family="monospace" font-size="11" text-anchor="middle">PAYLOAD LEN: 1024 B</text>

        <rect x="208" width="422" height="40" rx="4" fill="#14303b" stroke="#00FFB3" stroke-width="1" />
        <text x="419" y="24" fill="#00FFB3" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">CRC32 INTEGRITY CHECKSUM (0x9E3779B9)</text>
      </g>

      <!-- Row 4: Raw Encrypted Payload Area -->
      <g transform="translate(0, 165)">
        <rect width="630" height="45" rx="6" fill="#0b1a2e" stroke="url(#zp-flow)" stroke-width="1.5" />
        <text x="315" y="28" fill="#E5E7F5" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">STREAM PAYLOAD (Raw Python Sockets · Zero Memory Copy)</text>
      </g>
    </g>
  </g>
</svg>