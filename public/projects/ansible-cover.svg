<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1e" />
      <stop offset="50%" stop-color="#0a1532" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFB3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#00E5FF" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800" />
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="220" r="140" fill="#00E5FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="280" r="160" fill="#7B61FF" opacity="0.08" filter="url(#glow)" />

  <!-- Ansible Controller Node (Left) -->
  <g transform="translate(60, 120)">
    <!-- Window Frame -->
    <rect width="280" height="260" rx="16" fill="#0c142c" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Header -->
    <rect width="280" height="36" rx="16" fill="#121e42" />
    <rect y="20" width="280" height="16" fill="#121e42" />
    <circle cx="20" cy="18" r="5" fill="#FF5F56" />
    <circle cx="36" cy="18" r="5" fill="#FFBD2E" />
    <circle cx="52" cy="18" r="5" fill="#27C93F" />
    <text x="140" y="22" fill="#E5E7F5" font-family="monospace" font-size="11" text-anchor="middle" opacity="0.8">ansible-playbook.yml</text>

    <!-- Code Lines -->
    <g font-family="monospace" font-size="11">
      <text x="20" y="65" fill="#7B61FF">- name: <tspan fill="#00FFB3">Harden Linux Fleet</tspan></text>
      <text x="30" y="85" fill="#E5E7F5" opacity="0.7">hosts: <tspan fill="#00E5FF">production_nodes</tspan></text>
      <text x="30" y="105" fill="#E5E7F5" opacity="0.7">become: <tspan fill="#FFBD2E">true</tspan></text>
      <text x="30" y="130" fill="#7B61FF">tasks:</text>
      <text x="40" y="150" fill="#E5E7F5" opacity="0.8">- name: <tspan fill="#00FFB3">SSH Hardening</tspan></text>
      <text x="50" y="170" fill="#00E5FF">  lineinfile: PermitRootLogin no</text>
      <text x="40" y="195" fill="#E5E7F5" opacity="0.8">- name: <tspan fill="#00FFB3">Setup UFW Firewall</tspan></text>
      <text x="50" y="215" fill="#00E5FF">  ufw: state=enabled default=deny</text>
      <text x="40" y="240" fill="#00FFB3">✓ PLAY RECAP: ok=18 changed=4</text>
    </g>
  </g>

  <!-- Connecting Data Streams -->
  <g stroke="url(#cyan-violet)" stroke-width="2" stroke-dasharray="6,4" fill="none">
    <path d="M340 180 C 420 180, 430 140, 480 140" />
    <path d="M340 250 C 420 250, 430 250, 480 250" />
    <path d="M340 320 C 420 320, 430 360, 480 360" />
  </g>

  <!-- Target Server Nodes (Right) -->
  <!-- Node 1: Web Tier -->
  <g transform="translate(480, 100)">
    <rect width="260" height="70" rx="12" fill="#0a1226" stroke="#00FFB3" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="25" cy="35" r="8" fill="#00FFB3" filter="url(#glow)" opacity="0.8" />
    <text x="45" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="13">web-cluster-01.prod</text>
    <text x="45" y="48" fill="#00FFB3" font-family="monospace" font-size="11">SSH: 2222 · UFW Active · OK</text>
    <rect x="200" y="25" width="45" height="20" rx="6" fill="#00FFB3" fill-opacity="0.15" />
    <text x="222" y="39" fill="#00FFB3" font-family="monospace" font-size="10" text-anchor="middle">SYNC</text>
  </g>

  <!-- Node 2: Database Tier -->
  <g transform="translate(480, 210)">
    <rect width="260" height="70" rx="12" fill="#0a1226" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="25" cy="35" r="8" fill="#00E5FF" filter="url(#glow)" opacity="0.8" />
    <text x="45" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="13">db-primary-01.internal</text>
    <text x="45" y="48" fill="#00E5FF" font-family="monospace" font-size="11">Mongo Security Hardened</text>
    <rect x="200" y="25" width="45" height="20" rx="6" fill="#00E5FF" fill-opacity="0.15" />
    <text x="222" y="39" fill="#00E5FF" font-family="monospace" font-size="10" text-anchor="middle">IDLE</text>
  </g>

  <!-- Node 3: Gateway Tier -->
  <g transform="translate(480, 320)">
    <rect width="260" height="70" rx="12" fill="#0a1226" stroke="#7B61FF" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="25" cy="35" r="8" fill="#7B61FF" filter="url(#glow)" opacity="0.8" />
    <text x="45" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600" font-size="13">gw-ingress-02.edge</text>
    <text x="45" y="48" fill="#7B61FF" font-family="monospace" font-size="11">TLS 1.3 · Fail2Ban Active</text>
    <rect x="200" y="25" width="45" height="20" rx="6" fill="#7B61FF" fill-opacity="0.15" />
    <text x="222" y="39" fill="#7B61FF" font-family="monospace" font-size="10" text-anchor="middle">LOCK</text>
  </g>

  <!-- Badge / Bottom Tag -->
  <g transform="translate(60, 420)">
    <rect width="220" height="32" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="1" />
    <text x="110" y="20" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">⚡ ZERO-DRIFT AUTOMATION</text>
  </g>
</svg>