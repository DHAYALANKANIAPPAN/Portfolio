<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08091a" />
      <stop offset="50%" stop-color="#101032" />
      <stop offset="100%" stop-color="#050612" />
    </linearGradient>
    <linearGradient id="bm-cyan-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="bm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bm-bg)" />
  
  <g opacity="0.1" stroke="#00FFB3" stroke-width="1">
    <circle cx="400" cy="250" r="120" fill="none" />
    <circle cx="400" cy="250" r="220" fill="none" />
    <circle cx="400" cy="250" r="320" fill="none" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="400" y1="0" x2="400" y2="500" />
  </g>

  <!-- Browser Security Inspector Window -->
  <g transform="translate(70, 70)">
    <rect width="660" height="360" rx="16" fill="#0b1026" stroke="#00FFB3" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Bar -->
    <rect width="660" height="40" rx="16" fill="#131a3d" />
    <rect y="24" width="660" height="16" fill="#131a3d" />
    <circle cx="24" cy="20" r="5" fill="#FF5F56" />
    <circle cx="40" cy="20" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="20" r="5" fill="#27C93F" />
    
    <!-- URL / Omnibox bar -->
    <rect x="90" y="8" width="460" height="24" rx="6" fill="#080c1d" />
    <text x="105" y="24" fill="#00FFB3" font-family="monospace" font-size="11">🔒 https://inspector.telemetry.local/live-stream</text>
    <rect x="570" y="8" width="70" height="24" rx="6" fill="#00FFB3" fill-opacity="0.2" />
    <text x="605" y="24" fill="#00FFB3" font-family="monospace" font-size="10" text-anchor="middle">LIVE 60FPS</text>

    <!-- Left: Telemetry Feed -->
    <g transform="translate(20, 60)">
      <rect width="320" height="270" rx="10" fill="#080c1e" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="15" y="25" fill="#E5E7F5" font-family="system-ui" font-weight="600" font-size="12">Captured Browser Events (Python Hook)</text>
      
      <!-- Event 1 -->
      <g transform="translate(12, 40)">
        <rect width="296" height="44" rx="6" fill="#111838" />
        <circle cx="15" cy="22" r="4" fill="#00FFB3" />
        <text x="28" y="18" fill="#FFFFFF" font-family="monospace" font-size="11">DOM Mutation · Script Injection</text>
        <text x="28" y="34" fill="#00FFB3" font-family="monospace" font-size="9">source: inline_eval | risk: LOW</text>
      </g>
      
      <!-- Event 2 -->
      <g transform="translate(12, 92)">
        <rect width="296" height="44" rx="6" fill="#111838" />
        <circle cx="15" cy="22" r="4" fill="#FFBD2E" />
        <text x="28" y="18" fill="#FFFFFF" font-family="monospace" font-size="11">Network Hook · WebRTC Leak</text>
        <text x="28" y="34" fill="#FFBD2E" font-family="monospace" font-size="9">stun.l.google.com | blocked: TRUE</text>
      </g>

      <!-- Event 3 -->
      <g transform="translate(12, 144)">
        <rect width="296" height="44" rx="6" fill="#111838" />
        <circle cx="15" cy="22" r="4" fill="#00E5FF" />
        <text x="28" y="18" fill="#FFFFFF" font-family="monospace" font-size="11">Cookie State · Storage Access</text>
        <text x="28" y="34" fill="#00E5FF" font-family="monospace" font-size="9">domain: session_token | httpOnly: YES</text>
      </g>

      <!-- Event 4 -->
      <g transform="translate(12, 196)">
        <rect width="296" height="44" rx="6" fill="#111838" />
        <circle cx="15" cy="22" r="4" fill="#7B61FF" />
        <text x="28" y="18" fill="#FFFFFF" font-family="monospace" font-size="11">Canvas Fingerprint Read</text>
        <text x="28" y="34" fill="#7B61FF" font-family="monospace" font-size="9">toDataURL() intercepted & spoofed</text>
      </g>
    </g>

    <!-- Right: Activity Graph & Metrics -->
    <g transform="translate(360, 60)">
      <rect width="280" height="270" rx="10" fill="#080c1e" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="15" y="25" fill="#E5E7F5" font-family="system-ui" font-weight="600" font-size="12">Telemetry Timeline & Frequency</text>

      <!-- Waveform Graph -->
      <g transform="translate(15, 45)">
        <rect width="250" height="110" rx="6" fill="#0d1430" />
        <!-- Grid lines -->
        <line x1="0" y1="28" x2="250" y2="28" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="0" y1="55" x2="250" y2="55" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="0" y1="82" x2="250" y2="82" stroke="#ffffff" stroke-opacity="0.05" />
        
        <!-- Sine / activity line -->
        <path d="M 10 90 Q 30 20, 50 70 T 90 40 T 130 80 T 170 15 T 210 60 T 240 30" fill="none" stroke="#00FFB3" stroke-width="2.5" filter="url(#bm-glow)" />
        <path d="M 10 90 Q 30 20, 50 70 T 90 40 T 130 80 T 170 15 T 210 60 T 240 30 L 240 110 L 10 110 Z" fill="#00FFB3" fill-opacity="0.1" />
      </g>

      <!-- Stat blocks -->
      <g transform="translate(15, 175)">
        <rect width="118" height="75" rx="8" fill="#111838" />
        <text x="12" y="25" fill="#E5E7F5" opacity="0.6" font-family="system-ui" font-size="10">INTERCEPT RATE</text>
        <text x="12" y="52" fill="#00FFB3" font-family="monospace" font-weight="bold" font-size="20">1.2k/s</text>
      </g>

      <g transform="translate(145, 175)">
        <rect width="120" height="75" rx="8" fill="#111838" />
        <text x="12" y="25" fill="#E5E7F5" opacity="0.6" font-family="system-ui" font-size="10">LATENCY OVERHEAD</text>
        <text x="12" y="52" fill="#00E5FF" font-family="monospace" font-weight="bold" font-size="20">&lt; 0.8ms</text>
      </g>
    </g>
  </g>
</svg>