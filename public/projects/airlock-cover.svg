<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="airlock-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a" />
      <stop offset="50%" stop-color="#161226" />
      <stop offset="100%" stop-color="#080512" />
    </linearGradient>
    <linearGradient id="amber-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FF4D6D" />
    </linearGradient>
    <filter id="airlock-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#airlock-bg)" />

  <!-- Security Lattice Grid -->
  <g opacity="0.12" stroke="#FFB703" stroke-width="1">
    <path d="M0 60 H800 M0 130 H800 M0 200 H800 M0 270 H800 M0 340 H800 M0 410 H800 M0 480 H800" />
    <path d="M60 0 V500 M140 0 V500 M220 0 V500 M300 0 V500 M380 0 V500 M460 0 V500 M540 0 V500 M620 0 V500 M700 0 V500 M780 0 V500" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="240" r="140" fill="#FFB703" opacity="0.08" filter="url(#airlock-glow)" />
  <circle cx="600" cy="260" r="150" fill="#FF4D6D" opacity="0.08" filter="url(#airlock-glow)" />

  <!-- Main Vault Window Frame -->
  <g transform="translate(50, 45)">
    <rect width="700" height="410" rx="16" fill="#110d21" stroke="#FFB703" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Header -->
    <rect width="700" height="42" rx="16" fill="#1b1533" />
    <rect y="24" width="700" height="18" fill="#1b1533" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="350" y="26" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Airlock — AWS Access Keys Vault &amp; Security Credential Quarantine</text>

    <!-- Inner Split Layout -->
    <g transform="translate(20, 58)">
      <!-- Left: Quarantine Chamber & Key Masking -->
      <g>
        <rect width="390" height="315" rx="12" fill="#0b0818" stroke="#FFB703" stroke-width="1" stroke-opacity="0.3" />
        
        <!-- Key Quarantine Chamber Banner -->
        <g transform="translate(15, 15)">
          <rect width="360" height="52" rx="8" fill="#201538" stroke="#FF4D6D" stroke-width="1" />
          <circle cx="28" cy="26" r="12" fill="#FF4D6D" opacity="0.2" />
          <text x="28" y="31" fill="#FF4D6D" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">🛡️</text>
          <text x="50" y="24" fill="#FF4D6D" font-family="monospace" font-size="11" font-weight="bold">CREDENTIAL AIRLOCK: SEALED</text>
          <text x="50" y="40" fill="#E5E7F5" opacity="0.8" font-family="monospace" font-size="9">Root AWS Keys Quarantined · Zero Disk Plaintext</text>
        </g>

        <!-- Simulated Vault CLI Terminal -->
        <g transform="translate(15, 80)">
          <rect width="360" height="220" rx="8" fill="#06040d" stroke="#ffffff" stroke-opacity="0.08" />
          <g font-family="monospace" font-size="10" transform="translate(14, 20)">
            <text x="0" y="0" fill="#FFB703">$ airlock status --profile prod</text>
            <text x="0" y="20" fill="#E5E7F5" opacity="0.7">Target Key: <tspan fill="#FFFFFF">AKIA•••••••••••8X4Q</tspan></text>
            <text x="0" y="38" fill="#E5E7F5" opacity="0.7">Quarantine State: <tspan fill="#00FFB3">[ENCRYPTED AES-256-GCM]</tspan></text>
            <text x="0" y="56" fill="#E5E7F5" opacity="0.7">Key Age Watchdog: <tspan fill="#FFBD2E">28 Days / 30 Days SLA</tspan></text>
            
            <line x1="0" y1="72" x2="330" y2="72" stroke="#ffffff" stroke-opacity="0.1" />

            <text x="0" y="92" fill="#FFB703">$ airlock token --role deployer --ttl 900</text>
            <text x="0" y="112" fill="#00FFB3">✓ Generated Ephemeral STS Session Token</text>
            <text x="0" y="130" fill="#E5E7F5" opacity="0.7">AccessKeyId: <tspan fill="#00E5FF">ASIA•••••••••••K3MN</tspan></text>
            <text x="0" y="148" fill="#E5E7F5" opacity="0.7">Session Expiry: <tspan fill="#FFBD2E">14:59s remaining</tspan></text>
            <text x="0" y="168" fill="#00FFB3">✓ Auto-revocation scheduled on exit</text>
          </g>
        </g>
      </g>

      <!-- Right: Security Policies & Rotation Matrix -->
      <g transform="translate(405, 0)">
        <rect width="255" height="315" rx="12" fill="#0b0818" stroke="#ffffff" stroke-opacity="0.08" />
        
        <g transform="translate(16, 22)" font-family="monospace">
          <text x="0" y="0" fill="#FFB703" font-size="11" font-weight="bold">SECURITY POLICIES</text>
          
          <rect y="14" width="223" height="48" rx="6" fill="#1a1230" stroke="#FF4D6D" stroke-width="0.8" />
          <text x="10" y="34" fill="#E5E7F5" font-size="10">Auto-Rotation Watchdog:</text>
          <text x="10" y="50" fill="#FF4D6D" font-size="11" font-weight="bold">IAM Automated Rotation</text>

          <rect y="70" width="223" height="52" rx="6" fill="#130e24" />
          <text x="10" y="90" fill="#E5E7F5" opacity="0.7" font-size="9">Encryption Mechanism</text>
          <text x="10" y="110" fill="#00FFB3" font-size="11" font-weight="bold">AES-256 Envelope / PBKDF2</text>

          <rect y="130" width="223" height="52" rx="6" fill="#130e24" />
          <text x="10" y="150" fill="#E5E7F5" opacity="0.7" font-size="9">Leak Prevention Boundary</text>
          <text x="10" y="170" fill="#FFB703" font-size="11" font-weight="bold">Zero Git Plaintext Risk</text>

          <rect y="190" width="223" height="85" rx="6" fill="#201538" stroke="#FFB703" stroke-width="1" />
          <text x="10" y="210" fill="#FFB703" font-size="10" font-weight="bold">CLOUD STACK</text>
          <text x="10" y="228" fill="#E5E7F5" font-size="9">• Python CLI &amp; Background Vault</text>
          <text x="10" y="244" fill="#E5E7F5" font-size="9">• AWS IAM API &amp; Boto3</text>
          <text x="10" y="260" fill="#00FFB3" font-size="9">• Cryptography &amp; Fernet</text>
        </g>
      </g>
    </g>
  </g>
</svg>
