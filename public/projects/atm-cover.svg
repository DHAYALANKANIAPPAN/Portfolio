<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="atm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="50%" stop-color="#0e1e42" />
      <stop offset="100%" stop-color="#040816" />
    </linearGradient>
    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBD2E" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <filter id="atm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#atm-bg)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#00E5FF" stroke-width="1">
    <path d="M0 60 H800 M0 140 H800 M0 220 H800 M0 300 H800 M0 380 H800 M0 460 H800" />
    <path d="M60 0 V500 M160 0 V500 M260 0 V500 M360 0 V500 M460 0 V500 M560 0 V500 M660 0 V500 M760 0 V500" />
  </g>

  <!-- ATM System Interface -->
  <g transform="translate(60, 70)">
    <rect width="680" height="360" rx="18" fill="#0c1735" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Bar -->
    <rect width="680" height="42" rx="18" fill="#132450" />
    <rect y="24" width="680" height="18" fill="#132450" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="340" y="26" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Java OOP ATM &amp; Account Transaction System (maincode.java)</text>

    <!-- Content Split -->
    <g transform="translate(25, 60)">
      <!-- Left: Screen Display -->
      <g>
        <rect width="360" height="260" rx="12" fill="#081024" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" />
        <rect x="15" y="15" width="330" height="45" rx="8" fill="#102045" />
        <text x="30" y="35" fill="#FFBD2E" font-family="monospace" font-size="11">CURRENT ACCOUNT #****8921</text>
        <text x="30" y="50" fill="#00FFB3" font-family="monospace" font-size="12" font-weight="bold">BALANCE: $14,850.00 USD</text>

        <!-- Transaction Options -->
        <g transform="translate(15, 75)" font-family="monospace" font-size="11">
          <rect width="155" height="36" rx="6" fill="#152755" />
          <text x="15" y="23" fill="#00E5FF">1. Withdraw</text>

          <rect x="175" width="155" height="36" rx="6" fill="#152755" />
          <text x="190" y="23" fill="#00E5FF">2. Deposit</text>

          <rect y="48" width="155" height="36" rx="6" fill="#152755" />
          <text x="15" y="71" fill="#00E5FF">3. Transfer</text>

          <rect x="175" y="48" width="155" height="36" rx="6" fill="#152755" />
          <text x="190" y="71" fill="#00E5FF">4. Mini-Statement</text>
        </g>

        <!-- Status Log -->
        <rect x="15" y="180" width="330" height="65" rx="6" fill="#0b1733" />
        <text x="25" y="200" fill="#00FFB3" font-family="monospace" font-size="10">✓ PIN Authentication: SUCCESS</text>
        <text x="25" y="218" fill="#E5E7F5" opacity="0.8" font-family="monospace" font-size="10">Transaction ID: TXN-849204-OK</text>
        <text x="25" y="234" fill="#00E5FF" font-family="monospace" font-size="9">Session Timeout: 120s · Encrypted Ledger</text>
      </g>

      <!-- Right: Java OOP Architecture Panel -->
      <g transform="translate(385, 0)">
        <rect width="245" height="260" rx="12" fill="#081024" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="16" y="26" fill="#FFBD2E" font-family="monospace" font-size="11" font-weight="bold">OOP ARCHITECTURE</text>

        <g transform="translate(14, 42)" font-family="monospace" font-size="10">
          <rect width="217" height="38" rx="6" fill="#122045" />
          <text x="10" y="16" fill="#FFFFFF">class Account</text>
          <text x="10" y="30" fill="#00E5FF">Encapsulation &amp; PIN Validation</text>

          <rect y="46" width="217" height="38" rx="6" fill="#122045" />
          <text x="10" y="62" fill="#FFFFFF">class TransactionEngine</text>
          <text x="10" y="76" fill="#00FFB3">Atomic Balance Mutation</text>

          <rect y="92" width="217" height="38" rx="6" fill="#122045" />
          <text x="10" y="108" fill="#FFFFFF">class ReceiptPrinter</text>
          <text x="10" y="122" fill="#7B61FF">Thread-Safe I/O Formatting</text>

          <rect y="140" width="217" height="60" rx="6" fill="#182c5a" stroke="#FFBD2E" stroke-width="1" />
          <text x="10" y="160" fill="#FFBD2E">Tech Stack: Java SE</text>
          <text x="10" y="176" fill="#E5E7F5">Data Structure: HashMap / Lists</text>
          <text x="10" y="192" fill="#00FFB3">Pattern: MVC / State Machine</text>
        </g>
      </g>
    </g>
  </g>
</svg>
