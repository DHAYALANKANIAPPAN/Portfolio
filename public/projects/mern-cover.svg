<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mern-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1f" />
      <stop offset="50%" stop-color="#0b1e38" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>
    <linearGradient id="mern-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="33%" stop-color="#00FFB3" />
      <stop offset="66%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#47A248" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mern-bg)" />

  <g opacity="0.12" stroke="#00E5FF" stroke-width="1">
    <path d="M0 80 H800 M0 160 H800 M0 240 H800 M0 320 H800 M0 400 H800" />
    <path d="M80 0 V500 M160 0 V500 M240 0 V500 M320 0 V500 M400 0 V500 M480 0 V500 M560 0 V500 M640 0 V500 M720 0 V500" />
  </g>

  <!-- MERN Cloud Stack Pipeline -->
  <g transform="translate(60, 80)">
    <rect width="680" height="340" rx="16" fill="#08142b" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Header -->
    <rect width="680" height="40" rx="16" fill="#0e2348" />
    <rect y="24" width="680" height="16" fill="#0e2348" />
    <circle cx="24" cy="20" r="5" fill="#FF5F56" />
    <circle cx="40" cy="20" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="20" r="5" fill="#27C93F" />
    <text x="340" y="24" fill="#FFFFFF" font-family="system-ui" font-weight="600" font-size="12" text-anchor="middle">Full-Stack MERN Architecture &amp; DevSecOps Pipeline</text>

    <!-- 4-Tier Interactive Blocks -->
    <g transform="translate(25, 60)">
      <!-- Tier 1: React / Next Frontend -->
      <g>
        <rect width="135" height="230" rx="10" fill="#0d1f3d" stroke="#00E5FF" stroke-width="1" />
        <circle cx="67" cy="40" r="22" fill="#00E5FF" fill-opacity="0.15" />
        <text x="67" y="45" fill="#00E5FF" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="middle">⚛</text>
        <text x="67" y="80" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">React / Next</text>
        <text x="67" y="98" fill="#00E5FF" font-family="monospace" font-size="10" text-anchor="middle">Frontend UI</text>
        <line x1="20" y1="115" x2="115" y2="115" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="67" y="135" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Tailwind CSS</text>
        <text x="67" y="155" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Framer Motion</text>
        <text x="67" y="175" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Axios / TanStack</text>
        <text x="67" y="205" fill="#00FFB3" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">SSL / CSP Sealed</text>
      </g>

      <!-- Connection Arrow 1 -->
      <path d="M 140 115 L 160 115" stroke="#00FFB3" stroke-width="2" stroke-dasharray="4,2" />

      <!-- Tier 2: Express / Node API Gateway -->
      <g transform="translate(165, 0)">
        <rect width="135" height="230" rx="10" fill="#0d1f3d" stroke="#00FFB3" stroke-width="1" />
        <circle cx="67" cy="40" r="22" fill="#00FFB3" fill-opacity="0.15" />
        <text x="67" y="45" fill="#00FFB3" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">EX</text>
        <text x="67" y="80" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">Express / Node</text>
        <text x="67" y="98" fill="#00FFB3" font-family="monospace" font-size="10" text-anchor="middle">REST &amp; Auth API</text>
        <line x1="20" y1="115" x2="115" y2="115" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="67" y="135" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">JWT + RBAC</text>
        <text x="67" y="155" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Rate Limiting</text>
        <text x="67" y="175" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Input Sanitizer</text>
        <text x="67" y="205" fill="#00FFB3" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">OWASP Guarded</text>
      </g>

      <!-- Connection Arrow 2 -->
      <path d="M 305 115 L 325 115" stroke="#7B61FF" stroke-width="2" stroke-dasharray="4,2" />

      <!-- Tier 3: MongoDB Database -->
      <g transform="translate(330, 0)">
        <rect width="135" height="230" rx="10" fill="#0d1f3d" stroke="#47A248" stroke-width="1" />
        <circle cx="67" cy="40" r="22" fill="#47A248" fill-opacity="0.15" />
        <text x="67" y="45" fill="#47A248" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">🍃</text>
        <text x="67" y="80" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">MongoDB</text>
        <text x="67" y="98" fill="#47A248" font-family="monospace" font-size="10" text-anchor="middle">NoSQL Cluster</text>
        <line x1="20" y1="115" x2="115" y2="115" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="67" y="135" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Mongoose Models</text>
        <text x="67" y="155" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Index Optimization</text>
        <text x="67" y="175" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Encrypted at Rest</text>
        <text x="67" y="205" fill="#47A248" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Atlas Replica Set</text>
      </g>

      <!-- Connection Arrow 3 -->
      <path d="M 470 115 L 490 115" stroke="#7B61FF" stroke-width="2" stroke-dasharray="4,2" />

      <!-- Tier 4: Docker & CI/CD Pipeline -->
      <g transform="translate(495, 0)">
        <rect width="135" height="230" rx="10" fill="#0d1f3d" stroke="#7B61FF" stroke-width="1" />
        <circle cx="67" cy="40" r="22" fill="#7B61FF" fill-opacity="0.15" />
        <text x="67" y="45" fill="#7B61FF" font-family="system-ui" font-size="16" font-weight="bold" text-anchor="middle">🐳</text>
        <text x="67" y="80" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13" text-anchor="middle">DevSecOps</text>
        <text x="67" y="98" fill="#7B61FF" font-family="monospace" font-size="10" text-anchor="middle">CI/CD &amp; Infra</text>
        <line x1="20" y1="115" x2="115" y2="115" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="67" y="135" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Docker Compose</text>
        <text x="67" y="155" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">GitHub Actions</text>
        <text x="67" y="175" fill="#E5E7F5" opacity="0.7" font-family="monospace" font-size="9" text-anchor="middle">Trivy Vuln Scan</text>
        <text x="67" y="205" fill="#7B61FF" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Automated Deploy</text>
      </g>
    </g>
  </g>
</svg>
