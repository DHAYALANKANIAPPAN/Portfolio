<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="narcox-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0515" />
      <stop offset="50%" stop-color="#140a28" />
      <stop offset="100%" stop-color="#05020c" />
    </linearGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="narcox-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#narcox-bg)" />

  <!-- Cyber Matrix Recon Grid -->
  <g opacity="0.12" stroke="#7B61FF" stroke-width="1">
    <path d="M0 60 H800 M0 130 H800 M0 200 H800 M0 270 H800 M0 340 H800 M0 410 H800 M0 480 H800" />
    <path d="M60 0 V500 M140 0 V500 M220 0 V500 M300 0 V500 M380 0 V500 M460 0 V500 M540 0 V500 M620 0 V500 M700 0 V500 M780 0 V500" />
    <!-- Diagonal crosshairs -->
    <line x1="180" y1="180" x2="300" y2="300" stroke="#00E5FF" stroke-dasharray="3,3" />
    <line x1="300" y1="180" x2="180" y2="300" stroke="#00E5FF" stroke-dasharray="3,3" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="240" r="140" fill="#7B61FF" opacity="0.1" filter="url(#narcox-glow)" />
  <circle cx="620" cy="250" r="150" fill="#00E5FF" opacity="0.08" filter="url(#narcox-glow)" />

  <!-- Main Scanner Window Frame -->
  <g transform="translate(50, 45)">
    <rect width="700" height="410" rx="16" fill="#0d071c" stroke="#7B61FF" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Header -->
    <rect width="700" height="42" rx="16" fill="#180e33" />
    <rect y="24" width="700" height="18" fill="#180e33" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="350" y="26" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Narcox — Threat Intelligence &amp; Network Vulnerability Auditor</text>

    <!-- Inner Split Layout -->
    <g transform="translate(20, 58)">
      <!-- Left: Recon Engine & Socket Terminal -->
      <g>
        <rect width="390" height="315" rx="12" fill="#070310" stroke="#7B61FF" stroke-width="1" stroke-opacity="0.3" />
        
        <!-- Live Audit Terminal -->
        <g transform="translate(15, 15)">
          <rect width="360" height="285" rx="8" fill="#05020a" stroke="#ffffff" stroke-opacity="0.08" />
          <g font-family="monospace" font-size="10" transform="translate(14, 20)">
            <text x="0" y="0" fill="#7B61FF">narcox@recon-node:~$ <tspan fill="#00E5FF">./narcox --subnet 192.168.1.0/24</tspan></text>
            <text x="0" y="20" fill="#E5E7F5" opacity="0.7">[*] Initializing asynchronous socket worker pool (250 threads)...</text>
            <text x="0" y="38" fill="#E5E7F5" opacity="0.7">[*] Probing target subnet: 254 potential hosts...</text>
            
            <text x="0" y="64" fill="#00FFB3">[+] Host Alive: 192.168.1.45 (Latency: 1.8ms)</text>
            <text x="14" y="82" fill="#E5E7F5" opacity="0.9">├─ Port 22/tcp: OPEN [OpenSSH 8.2p1 Ubuntu]</text>
            <text x="14" y="100" fill="#E5E7F5" opacity="0.9">├─ Port 80/tcp: OPEN [nginx/1.18.0 - Reverse Proxy]</text>
            <text x="14" y="118" fill="#FF5376">├─ Port 27017/tcp: OPEN [MongoDB daemon exposed!]</text>
            <text x="14" y="136" fill="#FFBD2E">└─ Banner grab complete · Payload signatures checked</text>

            <line x1="0" y1="152" x2="330" y2="152" stroke="#ffffff" stroke-opacity="0.1" />

            <text x="0" y="172" fill="#7B61FF">[!] CVE Correlator Matching:</text>
            <text x="0" y="190" fill="#FF5376">  CRITICAL: Unauthenticated access vector on :27017</text>
            <text x="0" y="208" fill="#FFBD2E">  WARNING: Deprecated TLS cipher suite on :443</text>
            <text x="0" y="230" fill="#00FFB3">✓ Full audit report generated: narcox_report_45.json</text>
          </g>
        </g>
      </g>

      <!-- Right: Audit Metrics & Heuristics -->
      <g transform="translate(405, 0)">
        <rect width="255" height="315" rx="12" fill="#070310" stroke="#ffffff" stroke-opacity="0.08" />
        
        <g transform="translate(16, 22)" font-family="monospace">
          <text x="0" y="0" fill="#00E5FF" font-size="11" font-weight="bold">AUDIT CAPABILITIES</text>
          
          <rect y="14" width="223" height="48" rx="6" fill="#1b0e36" stroke="#7B61FF" stroke-width="0.8" />
          <text x="10" y="34" fill="#E5E7F5" font-size="10">Concurrency Engine:</text>
          <text x="10" y="50" fill="#00FFB3" font-size="11" font-weight="bold">Async Multi-threaded Probing</text>

          <rect y="70" width="223" height="52" rx="6" fill="#140a28" />
          <text x="10" y="90" fill="#E5E7F5" opacity="0.7" font-size="9">Heuristic Detection</text>
          <text x="10" y="110" fill="#FFBD2E" font-size="11" font-weight="bold">Banner &amp; Service Fingerprinting</text>

          <rect y="130" width="223" height="52" rx="6" fill="#140a28" />
          <text x="10" y="150" fill="#E5E7F5" opacity="0.7" font-size="9">Threat Assessment</text>
          <text x="10" y="170" fill="#FF5376" font-size="11" font-weight="bold">Real-time CVE Mapping</text>

          <rect y="190" width="223" height="85" rx="6" fill="#1b0e36" stroke="#00E5FF" stroke-width="1" />
          <text x="10" y="210" fill="#00E5FF" font-size="10" font-weight="bold">SECURITY STACK</text>
          <text x="10" y="228" fill="#E5E7F5" font-size="9">• Python 3 Raw Sockets</text>
          <text x="10" y="244" fill="#E5E7F5" font-size="9">• Scapy Packet Analysis</text>
          <text x="10" y="260" fill="#7B61FF" font-size="9">• Subnet Recon Automation</text>
        </g>
      </g>
    </g>
  </g>
</svg>
