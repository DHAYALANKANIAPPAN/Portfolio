<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>
    <linearGradient id="fp-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7B61FF" />
      <stop offset="100%" stop-color="#FF5376" />
    </linearGradient>
    <filter id="fp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fp-bg)" />

  <!-- Radar / Fingerprint Wave Circles -->
  <g opacity="0.15" stroke="#00E5FF" stroke-width="1.2" fill="none">
    <ellipse cx="400" cy="240" rx="140" ry="140" stroke-dasharray="8,6" />
    <ellipse cx="400" cy="240" rx="220" ry="220" />
    <ellipse cx="400" cy="240" rx="300" ry="300" stroke-dasharray="12,8" />
  </g>

  <!-- Central Analysis HUD -->
  <g transform="translate(60, 70)">
    <rect width="680" height="360" rx="18" fill="#0b1329" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Top Bar -->
    <rect width="680" height="42" rx="18" fill="#132042" />
    <rect y="24" width="680" height="18" fill="#132042" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="340" y="26" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Traffic Metadata &amp; Website Fingerprinting Engine</text>

    <!-- Content Grid -->
    <g transform="translate(25, 60)">
      <!-- Left: Encrypted Packet Burst Wave -->
      <rect width="360" height="260" rx="12" fill="#080e21" stroke="#ffffff" stroke-opacity="0.06" />
      <text x="16" y="24" fill="#00E5FF" font-family="monospace" font-size="11">PACKET BURST &amp; INTER-ARRIVAL TIME</text>
      
      <!-- Graph Lines -->
      <g transform="translate(16, 40)">
        <rect width="328" height="130" rx="6" fill="#0e1733" />
        <line x1="0" y1="32" x2="328" y2="32" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="0" y1="65" x2="328" y2="65" stroke="#ffffff" stroke-opacity="0.05" />
        <line x1="0" y1="98" x2="328" y2="98" stroke="#ffffff" stroke-opacity="0.05" />
        
        <!-- Packet bars / burst distribution -->
        <path d="M 10 110 L 10 80 M 20 110 L 20 40 M 30 110 L 30 20 M 40 110 L 40 60 M 60 110 L 60 10 M 70 110 L 70 30 M 90 110 L 90 70 M 110 110 L 110 15 M 130 110 L 130 50 M 160 110 L 160 25 M 190 110 L 190 60 M 220 110 L 220 10 M 250 110 L 250 40 M 280 110 L 280 20 M 310 110 L 310 80" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 10 90 Q 60 15, 110 20 T 220 15 T 310 70" fill="none" stroke="#7B61FF" stroke-width="2" filter="url(#fp-glow)" />
      </g>

      <!-- Classification Status -->
      <g transform="translate(16, 185)">
        <rect width="328" height="60" rx="8" fill="#132042" />
        <circle cx="20" cy="30" r="5" fill="#00FFB3" />
        <text x="34" y="24" fill="#FFFFFF" font-family="system-ui" font-weight="600" font-size="12">Fingerprint Match: 98.4% Confidence</text>
        <text x="34" y="44" fill="#00FFB3" font-family="monospace" font-size="10">Target Profile: Tor / Encrypted TLS Session</text>
      </g>

      <!-- Right: Extraction Features -->
      <g transform="translate(380, 0)">
        <rect width="250" height="260" rx="12" fill="#080e21" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="16" y="24" fill="#7B61FF" font-family="monospace" font-size="11">EXTRACTED FEATURES</text>

        <g transform="translate(16, 40)" font-family="monospace" font-size="10">
          <rect width="218" height="40" rx="6" fill="#111833" />
          <text x="12" y="18" fill="#FFFFFF">Total Bytes Transferred</text>
          <text x="12" y="32" fill="#00E5FF" font-weight="bold">1.48 MB · 1,240 pkts</text>

          <rect y="48" width="218" height="40" rx="6" fill="#111833" />
          <text x="12" y="66" fill="#FFFFFF">Burst Directionality</text>
          <text x="12" y="80" fill="#00FFB3" font-weight="bold">In: 84% · Out: 16%</text>

          <rect y="96" width="218" height="40" rx="6" fill="#111833" />
          <text x="12" y="114" fill="#FFFFFF">Packet Size Variance</text>
          <text x="12" y="128" fill="#FFBD2E" font-weight="bold">σ = 342.1 (MTU Clustered)</text>

          <rect y="144" width="218" height="48" rx="6" fill="#181a42" stroke="#7B61FF" stroke-width="1" />
          <text x="12" y="163" fill="#E5E7F5">Defense Countermeasure:</text>
          <text x="12" y="180" fill="#7B61FF" font-weight="bold">Packet Padding Active (Tamaraw)</text>
        </g>
      </g>
    </g>
  </g>
</svg>