<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a081c" />
      <stop offset="50%" stop-color="#180e30" />
      <stop offset="100%" stop-color="#070614" />
    </linearGradient>
    <linearGradient id="fl-sunset" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E56717" />
      <stop offset="50%" stop-color="#FF5376" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#fl-bg)" />

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="140" fill="#FF5376" opacity="0.08" />
  <circle cx="600" cy="300" r="150" fill="#7B61FF" opacity="0.08" />

  <!-- Forum Community UI Mockup -->
  <g transform="translate(60, 70)">
    <rect width="680" height="360" rx="16" fill="#100c24" stroke="#FF5376" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Top Nav -->
    <rect width="680" height="42" rx="16" fill="#1c143a" />
    <rect y="24" width="680" height="18" fill="#1c143a" />
    <circle cx="24" cy="21" r="5" fill="#FF5F56" />
    <circle cx="40" cy="21" r="5" fill="#FFBD2E" />
    <circle cx="56" cy="21" r="5" fill="#27C93F" />
    <text x="90" y="26" fill="#FFFFFF" font-family="system-ui" font-weight="bold" font-size="13">Flarum Community Platform</text>
    <rect x="520" y="9" width="130" height="24" rx="12" fill="#E56717" fill-opacity="0.2" stroke="#E56717" stroke-width="1" />
    <text x="585" y="25" fill="#FFBD2E" font-family="system-ui" font-weight="600" font-size="10" text-anchor="middle">+ Start Discussion</text>

    <!-- Side Categories & Main Feed -->
    <g transform="translate(20, 58)">
      <!-- Sidebar -->
      <g>
        <rect width="180" height="280" rx="10" fill="#150f2e" />
        <text x="14" y="26" fill="#E5E7F5" opacity="0.5" font-family="system-ui" font-size="10">CATEGORIES</text>
        
        <rect x="8" y="38" width="164" height="32" rx="6" fill="#291a4d" />
        <circle cx="22" cy="54" r="4" fill="#00E5FF" />
        <text x="34" y="58" fill="#FFFFFF" font-family="system-ui" font-size="11">All Discussions</text>

        <rect x="8" y="74" width="164" height="30" rx="6" fill="transparent" />
        <circle cx="22" cy="89" r="4" fill="#FF5376" />
        <text x="34" y="93" fill="#E5E7F5" opacity="0.8" font-family="system-ui" font-size="11">Security &amp; Infra</text>

        <rect x="8" y="108" width="164" height="30" rx="6" fill="transparent" />
        <circle cx="22" cy="123" r="4" fill="#00FFB3" />
        <text x="34" y="127" fill="#E5E7F5" opacity="0.8" font-family="system-ui" font-size="11">MERN Stack Lab</text>

        <rect x="8" y="142" width="164" height="30" rx="6" fill="transparent" />
        <circle cx="22" cy="157" r="4" fill="#FFBD2E" />
        <text x="34" y="161" fill="#E5E7F5" opacity="0.8" font-family="system-ui" font-size="11">Extensions &amp; Mods</text>

        <rect x="12" y="210" width="156" height="55" rx="8" fill="#1d133d" stroke="#7B61FF" stroke-width="1" />
        <text x="22" y="230" fill="#7B61FF" font-family="monospace" font-size="10">FLARUM1 Extension</text>
        <text x="22" y="250" fill="#00FFB3" font-family="monospace" font-size="9">Webpack · Mithril.js Hooked</text>
      </g>

      <!-- Main Feed -->
      <g transform="translate(195, 0)">
        <rect width="445" height="280" rx="10" fill="#150f2e" />

        <!-- Thread 1 -->
        <g transform="translate(14, 15)">
          <rect width="417" height="74" rx="8" fill="#1e153f" />
          <circle cx="28" cy="28" r="14" fill="#7B61FF" />
          <text x="28" y="32" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">DK</text>
          <text x="52" y="26" fill="#FFFFFF" font-family="system-ui" font-weight="600" font-size="12">Ansible Playbook orchestration across 100+ nodes</text>
          <text x="52" y="44" fill="#E5E7F5" opacity="0.6" font-family="system-ui" font-size="10">Posted by Dhayalan · DevSecOps · 42 replies</text>
          <rect x="345" y="18" width="60" height="20" rx="4" fill="#00FFB3" fill-opacity="0.15" />
          <text x="375" y="32" fill="#00FFB3" font-family="monospace" font-size="9" text-anchor="middle">SOLVED</text>
        </g>

        <!-- Thread 2 -->
        <g transform="translate(14, 100)">
          <rect width="417" height="74" rx="8" fill="#1e153f" />
          <circle cx="28" cy="28" r="14" fill="#00E5FF" />
          <text x="28" y="32" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">JS</text>
          <text x="52" y="26" fill="#FFFFFF" font-family="system-ui" font-weight="600" font-size="12">Deep packet inspection using raw Python sockets</text>
          <text x="52" y="44" fill="#E5E7F5" opacity="0.6" font-family="system-ui" font-size="10">Posted in Security &amp; Infra · 28 replies</text>
          <rect x="345" y="18" width="60" height="20" rx="4" fill="#00E5FF" fill-opacity="0.15" />
          <text x="375" y="32" fill="#00E5FF" font-family="monospace" font-size="9" text-anchor="middle">FEATURE</text>
        </g>

        <!-- Thread 3 -->
        <g transform="translate(14, 185)">
          <rect width="417" height="74" rx="8" fill="#1e153f" />
          <circle cx="28" cy="28" r="14" fill="#FF5376" />
          <text x="28" y="32" fill="#FFFFFF" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">FL</text>
          <text x="52" y="26" fill="#FFFFFF" font-family="system-ui" font-weight="600" font-size="12">Custom Flarum Mithril frontend theming &amp; WebSocket bus</text>
          <text x="52" y="44" fill="#E5E7F5" opacity="0.6" font-family="system-ui" font-size="10">PHP core backend with custom JavaScript extension pipeline</text>
        </g>
      </g>
    </g>
  </g>
</svg>