<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cfn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0a" />
      <stop offset="50%" stop-color="#2a1e12" />
      <stop offset="100%" stop-color="#0d0a07" />
    </linearGradient>
    <linearGradient id="cfn-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#cfn-bg)" />
  <rect x="20" y="20" width="560" height="410" rx="14" fill="none" stroke="url(#cfn-gold)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="394" rx="10" fill="none" stroke="#FF9900" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.2" />

  <!-- CloudFormation Emblem -->
  <g transform="translate(300, 130)">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#382210" stroke="url(#cfn-gold)" stroke-width="2.5" />
    <!-- Stack of blocks -->
    <rect x="-18" y="4" width="36" height="10" rx="2" fill="#FF9900" />
    <rect x="-14" y="-8" width="28" height="9" rx="2" fill="#FFB84D" />
    <rect x="-10" y="-19" width="20" height="8" rx="2" fill="#FFE0B2" />
    <circle cx="28" cy="28" r="12" fill="#FF5A00" />
    <path d="M23,28 L27,32 L34,24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Organization -->
  <text x="300" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="19" text-anchor="middle">AWS CLOUDFORMATION AUTOMATION</text>
  <text x="300" y="244" fill="#FF9900" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Amazon Web Services (AWS) · Infrastructure Automation</text>

  <line x1="120" y1="266" x2="480" y2="266" stroke="#FFFFFF" stroke-opacity="0.1" />

  <!-- Recipient & Details -->
  <text x="300" y="295" fill="#E5E7F5" opacity="0.7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Awarded to</text>
  <text x="300" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">DHAYALAN KANIAPPAN</text>
  <text x="300" y="344" fill="#E5E7F5" opacity="0.6" font-family="monospace" font-size="11" text-anchor="middle">Template Stacks · Automation · Drift Detection</text>

  <!-- Seal -->
  <g transform="translate(140, 370)">
    <rect width="320" height="34" rx="17" fill="#3d210b" stroke="#FF9900" stroke-width="1" />
    <text x="160" y="21" fill="#FF9900" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✓ AWS LAB ACCREDITATION · SEP 04, 2026</text>
  </g>
</svg>
