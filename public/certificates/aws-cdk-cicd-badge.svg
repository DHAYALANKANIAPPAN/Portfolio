<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cdk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e1a" />
      <stop offset="50%" stop-color="#181c38" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>
    <linearGradient id="cdk-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7B61FF" />
    </linearGradient>
    <filter id="cdk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#cdk-bg)" />
  <rect x="20" y="20" width="560" height="410" rx="14" fill="none" stroke="url(#cdk-cyan)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="394" rx="10" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.2" />

  <!-- CDK Hexagon Emblem -->
  <g transform="translate(300, 130)" filter="url(#cdk-glow)">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#1b2046" stroke="url(#cdk-cyan)" stroke-width="2.5" />
    <path d="M-15,-5 L0,-20 L15,-5 L15,15 L-15,15 Z" fill="none" stroke="#00E5FF" stroke-width="2" />
    <circle cx="0" cy="5" r="4" fill="#7B61FF" />
    <circle cx="28" cy="28" r="12" fill="#00E5FF" />
    <path d="M23,28 L27,32 L34,24" fill="none" stroke="#0c0e1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Organization -->
  <text x="300" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">CI/CD PIPELINE WITH AWS CDK</text>
  <text x="300" y="244" fill="#00E5FF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Amazon Web Services (AWS) · Infrastructure as Code</text>

  <line x1="120" y1="266" x2="480" y2="266" stroke="#FFFFFF" stroke-opacity="0.1" />

  <!-- Recipient & Details -->
  <text x="300" y="295" fill="#E5E7F5" opacity="0.7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Awarded to</text>
  <text x="300" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">DHAYALAN KANIAPPAN</text>
  <text x="300" y="344" fill="#E5E7F5" opacity="0.6" font-family="monospace" font-size="11" text-anchor="middle">Managed Deployment Stage · Automated Rollouts</text>

  <!-- Seal -->
  <g transform="translate(140, 370)">
    <rect width="320" height="34" rx="17" fill="#1d2554" stroke="#00E5FF" stroke-width="1" />
    <text x="160" y="21" fill="#00E5FF" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✓ AWS LAB ACCREDITATION · SEP 04, 2026</text>
  </g>
</svg>
