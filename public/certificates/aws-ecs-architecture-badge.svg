<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="deep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#11223b" />
      <stop offset="100%" stop-color="#070d16" />
    </linearGradient>
    <linearGradient id="aws-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A4E4" />
      <stop offset="100%" stop-color="#232F3E" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#deep-bg)" />
  <rect x="20" y="20" width="560" height="410" rx="14" fill="none" stroke="#00A4E4" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="394" rx="10" fill="none" stroke="#00A4E4" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.2" />

  <!-- Shield + Gear Emblem -->
  <g transform="translate(300, 130)">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#132c4a" stroke="#00A4E4" stroke-width="2.5" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00A4E4" stroke-width="2.5" />
    <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#00A4E4" stroke-width="2.5" />
    <circle cx="28" cy="28" r="12" fill="#00A4E4" />
    <path d="M23,28 L27,32 L34,24" fill="none" stroke="#0a121e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Organization -->
  <text x="300" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">AMAZON ECS DEEP-DIVE SUITE</text>
  <text x="300" y="244" fill="#00A4E4" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Amazon Web Services (AWS) · Technical Series</text>

  <line x1="120" y1="266" x2="480" y2="266" stroke="#FFFFFF" stroke-opacity="0.1" />

  <!-- Recipient & Details -->
  <text x="300" y="295" fill="#E5E7F5" opacity="0.7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Awarded to</text>
  <text x="300" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">DHAYALAN KANIAPPAN</text>
  <text x="300" y="344" fill="#E5E7F5" opacity="0.6" font-family="monospace" font-size="11" text-anchor="middle">Security · Networking · Observability · Auto Scaling</text>

  <!-- Seal -->
  <g transform="translate(140, 370)">
    <rect width="320" height="34" rx="17" fill="#13355b" stroke="#00A4E4" stroke-width="1" />
    <text x="160" y="21" fill="#00A4E4" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✓ AWS SKILL BUILDER · SEP 05, 2026</text>
  </g>
