<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a131c" />
      <stop offset="50%" stop-color="#122436" />
      <stop offset="100%" stop-color="#080e14" />
    </linearGradient>
    <linearGradient id="gd-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFB3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#gd-bg)" />
  <rect x="20" y="20" width="560" height="410" rx="14" fill="none" stroke="url(#gd-teal)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="394" rx="10" fill="none" stroke="#00FFB3" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.2" />

  <!-- Game Dev Hexagon Emblem -->
  <g transform="translate(300, 130)">
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#132c40" stroke="url(#gd-teal)" stroke-width="2.5" />
    <!-- Gamepad Icon -->
    <path d="M-18,-6 C-18,-14 18,-14 18,-6 L14,14 C12,18 8,16 6,12 L-6,12 C-8,16 -12,18 -14,14 Z" fill="none" stroke="#00FFB3" stroke-width="2" />
    <circle cx="-7" cy="0" r="2" fill="#00E5FF" />
    <circle cx="7" cy="0" r="2" fill="#00E5FF" />
    <circle cx="28" cy="28" r="12" fill="#00FFB3" />
    <path d="M23,28 L27,32 L34,24" fill="none" stroke="#0a131c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Organization -->
  <text x="300" y="220" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">CLOUD GAME DEVELOPMENT BADGE</text>
  <text x="300" y="244" fill="#00FFB3" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Amazon Web Services (AWS) · Credly Verified</text>

  <line x1="120" y1="266" x2="480" y2="266" stroke="#FFFFFF" stroke-opacity="0.1" />

  <!-- Recipient & Details -->
  <text x="300" y="295" fill="#E5E7F5" opacity="0.7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Awarded to</text>
  <text x="300" y="322" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">DHAYALAN KANIAPPAN</text>
  <text x="300" y="344" fill="#E5E7F5" opacity="0.6" font-family="monospace" font-size="11" text-anchor="middle">GameLift · Low-Latency Servers · Cloud Infrastructure</text>

  <!-- Seal -->
  <g transform="translate(140, 370)">
    <rect width="320" height="34" rx="17" fill="#14344d" stroke="#00FFB3" stroke-width="1" />
    <text x="160" y="21" fill="#00FFB3" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">✓ CREDLY BADGE · SEPTEMBER 09, 2026</text>
  </g>
</svg>
