<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="50%" stop-color="#0f224a" />
      <stop offset="100%" stop-color="#050a18" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="50%" stop-color="#FFBD2E" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#jm-bg)" />
  
  <!-- Subtle Ornamental Borders -->
  <rect x="20" y="20" width="560" height="410" rx="14" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="28" y="28" width="544" height="394" rx="10" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.25" />

  <!-- Center Emblem -->
  <circle cx="300" cy="130" r="48" fill="#142854" stroke="url(#gold-grad)" stroke-width="2" filter="url(#badge-glow)" />
  <text x="300" y="125" fill="#FFD166" font-family="system-ui, sans-serif" font-size="26" text-anchor="middle">☕🍃</text>
  <text x="300" y="152" fill="#00FFB3" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">92% MERIT</text>

  <!-- Title / Headings -->
  <text x="300" y="215" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">JAVA + MONGODB</text>
  <text x="300" y="238" fill="#00E5FF" font-family="monospace" font-size="12" text-anchor="middle">Certificate of Merit (60 Days Course)</text>

  <!-- Divider Line -->
  <line x1="120" y1="260" x2="480" y2="260" stroke="#FFFFFF" stroke-opacity="0.1" />

  <!-- Recipient & Details -->
  <text x="300" y="290" fill="#E5E7F5" opacity="0.7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Awarded to</text>
  <text x="300" y="318" fill="#FFD166" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">DHAYALAN K</text>
  <text x="300" y="342" fill="#E5E7F5" opacity="0.6" font-family="monospace" font-size="11" text-anchor="middle">Hazhtech Career Development Centre · IACT</text>

  <!-- Verification Seal Tag -->
  <g transform="translate(180, 368)">
    <rect width="240" height="32" rx="16" fill="#162e60" stroke="#00FFB3" stroke-width="1" />
    <text x="120" y="20" fill="#00FFB3" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">✓ VERIFIED CREDENTIAL · AUGUST 2025</text>
  </g>
</svg>
